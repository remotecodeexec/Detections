title: GhostLock SMB Exclusive Handle Accumulation
description: |
  Detects exclusive SMB file handle requests (ShareAccess = 0), which are utilized by the GhostLock denial-of-service technique.
  GhostLock is a proof-of-concept tool that evades traditional write-based ransomware defenses by locking files rather than encrypting them, causing widespread STATUS_SHARING_VIOLATION errors.
  Note: To effectively identify the attack and reduce false positives, implement thresholding/aggregation in your SIEM. It is highly recommended to alert only when the count of these events exceeds 500 within a 5-minute window, grouped by the source 'IpAddress'.
references:
  - https://ghostlock.io
  - https://www.bleepingcomputer.com/news/security/new-ghostlock-tool-abuses-windows-api-to-block-file-access/
author: Luís Marques, SIBS Cyberwatch @remotecodeexec
date: 2026-05-12
tags:
  - attack.ta0040
  - attack.t1499
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5145
    # Key logic: The '0' value represents an exclusive lock (deny-all sharing)
    # Note: This field may require custom log enrichment, NDR telemetry, or NAS-specific session logs to map correctly to EventID 5145
    ShareAccess:
      - '0x0'
      - '0x00000000'
      - '0'
  # You may need to added filters to machine with scanning software that is active!
  condition: selection # and not filter_known_scanners
falsepositives:
  - 'Legitimate applications opening files exclusively (e.g., Microsoft Word, Excel).'
  - 'Backup agents, file indexers, or synchronization tools sequentially scanning network shares. It is recommended to filter by known service IP addresses.'
  - 'If the aggregation threshold (e.g., 500) is set too low, it may trigger on normal heavy network share usage. Tune based on specific organizational baselines.'
level: high
