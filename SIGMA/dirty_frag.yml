title: ELF Binary Created
id: 81cefdcd-c6ab-4001-965b-8298b0572112 
name: elf_created_user_dir 
description: |
    This detection identifies the normal Dirty Frag TTPs in Linux environments, which are commonly used by attackers to escalate privileges on a Linux Box.
references:
    - https://thehackernews.com/2026/05/linux-kernel-dirty-frag-lpe-exploit.html
author: Luís Marques, SIBS Cyberwatch @remotecodeexec
date: 2026-05-11
tags:
    - attack.t1059.004
logsource:
    category: file_event
    product: linux
detection:
    selection:
        # These are the dirs that commonly used for staging the exploit, but you can add more if needed
        TargetFilename|startswith:
            - '/home/'
            - '/root/'
            - '/tmp/'
            - '/var/tmp/'
            - '/dev/shm/'
    condition: selection
falsepositives:
    - Legitimate user downloading or compiling binaries in their home or temporary directory.
level: low
---
title: Execution of Binary in User Directory
id: 0117d1f5-a8c9-49c3-8730-941a2d1cd289
name: execute_user_bin
description: Detects the execution of a binary located in a user or temporary directory. This is the second stage of a potential privilege escalation attack sequence.
references:
    - https://attack.mitre.org/techniques/T1548/003/
author: Luís Marques, SIBS Cyberwatch @remotecodeexec
date: 2026-05-11
tags:
    - attack.privilege-escalation
    - attack.t1548.003
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        # These are the dirs that commonly used for staging the exploit, but you can add more if needed, inline with the previous rule
        Image|startswith:
            - '/home/'
            - '/root/'
            - '/tmp/'
            - '/var/tmp/'
            - '/dev/shm/'
    condition: selection
falsepositives:
    - Legitimate execution of user-owned scripts or binaries.
level: low
---
title: SU Execution By User Binary
id: b516b1e7-dedc-4e28-8273-36a6db70347f
name: su_execution_user_bin
description: Detects a binary located in a user or temporary directory initiating a 'su' process. This is the third stage of a potential privilege escalation attack.
references:
    - https://attack.mitre.org/techniques/T1548/003/
author: Luís Marques, SIBS Cyberwatch @remotecodeexec
date: 2026-05-11
tags:
    - attack.privilege-escalation
    - attack.t1548.003
logsource:
    category: process_creation
    product: linux
detection:
    # This is the part for the su execution
    selection:
        # same deal with the dirs 
        Image|endswith: '/su'
        ParentImage|startswith:
            - '/home/'
            - '/root/'
            - '/tmp/'
            - '/var/tmp/'
            - '/dev/shm/'
    condition: selection
falsepositives:
    - Legitimate scripts located in user directories that require elevated privileges.
level: medium
---
title: ELF Binary Created In User Directory And Initiating SU
id: 86ba1997-4ac6-4fbe-83f1-2d672b3c2d79
description: A multi-stage correlation rule that detects an ELF binary being created in a user directory, subsequently executed, and then initiating a 'su' process. This behavior is highly suspicious and may indicate a fake 'su' prompt or a local privilege escalation attempt.
author: Luís Marques, SIBS Cyberwatch @remotecodeexec
date: 2026-05-11
tags:
    - attack.privilege-escalation
    - attack.t1548.003
# Putting all the previous rules together in a correlation rule  
correlation: 
  type: temporal
  rules:
    - elf_created_user_dir
    - execute_user_bin
    - su_execution_user_bin
  timespan: 10m 
rules:
    - elf_created_user_dir
    - execute_user_bin
    - su_execution_user_bin
timespan: 10m
falsepositives:
    # Tuning: If false positives occur due to unrelated overlapping events, consider mapping TargetFilename to Image, and Image to ParentImage in your SIEM to ensure the exact same file is involved in all stages.
    - Administrators compiling and executing scripts that use 'su' from their home directories.
level: high
