title: Non-Browser Process Connects to Chrome/Edge over Loopback
id: e6b1a2c4-3f7e-4c9a-9b1d-7a5e2c8f4d31
status: stable
description: Detects instances where the Microsoft Installer process (msiexec.exe) initiates
  a network connection to the local IPv4 loopback address (127.0.0.1). This
  behavior may indicate an MSI custom-action payload attempting to interact with a
  web browser through the Chrome DevTools Protocol (CDP) to establish a covert
  command-and-control channel.
author: Luís Marques, SIBS Cyberwatch @remotecodeexec
references:
  - 'https://blog.talosintelligence.com/chaos-msarat-living-off-the-browser-to-build-covert-c2-channel/'
date: '2026-07-24'
modified: '2026-07-24'
tags:
  - attack.t1071.001
  - attack.t1102.003
  - attack.t1106
logsource:
  category: network_connection
  product: windows
detection:
  selection_process:
    Image|endswith:
      - '\msiexec.exe'
  selection_loopback:
    DestinationIp: '127.0.0.1'
  condition: selection_process and selection_loopback
falsepositives:
  - 'MSI installation packages that use a local service or proxy on the loopback interface for legitimate configuration or registration purposes.'
level: high
fields:
  - Image
  - DestinationIp
  - DestinationPort
