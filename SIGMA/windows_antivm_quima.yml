title: QuimaRAT Anti-VM Registry Query via reg.exe
status: stable
id: 948af717-353c-427e-b1e6-233c8481f9af
description: |
  Detects the execution of 'reg.exe' with command line arguments that query registry keys associated with virtualization software, which is indicative of anti-VM behavior commonly observed in QuimaRAT malware. This detection identifies instances where 'reg.exe' is used to check for the presence of virtualization environments, which may suggest that the malware is attempting to evade analysis or detection in virtualized environments.
author: Luís Marques, SIBS Cyberwatch @remotecodeexec
date: '2026-07-07'
tags:
  - attack.t1012
  - attack.t1497.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\reg.exe'
    CommandLine|contains: 'query'
  selection_keys:
    CommandLine|contains:
      - 'SOFTWARE\Oracle\VirtualBox Guest Additions'
      - 'SOFTWARE\VMware, Inc.\VMware Tools'
      - 'SYSTEM\CurrentControlSet\Services\VBoxGuest'
  condition: selection_img and selection_keys
falsepositives:
  - Legitimate virtualization detection scripts or IT asset inventory tools
level: medium
fields:
  - CommandLine
  - Image
  - ParentImage
