title: Wscript/Cscript Chunked Download via MSXML2.XMLHTTP and ADODB.Stream to Temp/AppData VBS 
status: stable 
id: e5757df7-600d-47d4-b0d7-0b0f25e88ed8
description: Detects wscript.exe or cscript.exe executing a VBScript that uses MSXML2.XMLHTTP and ADODB.Stream to download a file in chunks (using the Range header) to a temporary or AppData location. This technique is often used by malware to evade detection by downloading payloads in smaller pieces.
author: Luís Marques, SIBS Cyberwatch @remotecodeexec
date: '2026-07-02'
modified: '2026-07-02'
tags:
  - attack.t1105
  - attack.t1027.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_engine:
    Image|endswith:
      - '\wscript.exe'
      - '\cscript.exe'
  selection_indicators:
    CommandLine|contains:
      - 'MSXML2.XMLHTTP'
      - 'ADODB.Stream'
      - 'Range: bytes='
  selection_path:
    CommandLine|contains:
      - '\AppData\Local\Temp'
      - '\AppData\Roaming'
  selection_filename:
    CommandLine|re: '\\[A-Za-z0-9]{6,12}\.vbs'
  condition: selection_engine and selection_indicators and selection_path and selection_filename
falsepositives:
  - Legitimate administrative VBScript tools performing HTTP range downloads (rare)
level: high
fields:
  - Image
  - CommandLine
  - ParentImage
