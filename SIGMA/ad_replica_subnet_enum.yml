title: AD Replication Subnet Enumeration via Get-ADReplicationSubnet
status: stable
id: f787f0be-a7cc-4c79-96b3-8c185dd1ffea
description: |
    Detects attempts to enumerate Active Directory replication subnets using the Get-ADReplicationSubnet cmdlet. This technique is often employed by attackers to gather information about the network topology and potential targets within a domain.
author: Luís Marques, SIBS Cyberwatch @remotecodeexec
references:
  - https://www.huntress.com/blog/ai-coded-malware-vibe-coding-active-directory
date: '2026-07-14'
modified: '2026-07-14'
tags:
  - attack.t1018
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd:
    CommandLine|contains: 'Get-ADReplicationSubnet'
  selection_args:
    CommandLine|contains:
      - '-Server $dc'
      - '-Filter *'
  selection_output:
    CommandLine|contains: 'AD_Subnets.csv'
  condition: selection_cmd and (selection_args or selection_output)
falsepositives:
  - Legitimate AD site/subnet administration or replication topology audits performed by domain administrators
fields:
  - CommandLine
  - Image
  - ParentImage
  - User
level: high