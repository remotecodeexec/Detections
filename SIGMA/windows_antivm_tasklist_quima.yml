title: QuimaRAT Anti-VM Process Enumeration via tasklist
status: stable
id: 0a4b31e8-b2ca-4d2a-9cee-3a816044a5c9
description: |
  Detects the execution of 'tasklist.exe' with command line arguments that enumerate running processes associated with virtualization software, which is indicative of anti-VM behavior commonly observed in QuimaRAT malware. This detection identifies instances where 'tasklist.exe' is used to check for the presence of virtualization environments, which may suggest that the malware is attempting to evade analysis or detection in virtualized environments.
author: Luís Marques, SIBS Cyberwatch @remotecodeexec
date: '2026-07-07'
modified: '2026-07-07'
tags:
  - attack.t1497.001
  - attack.t1057
logsource:
  category: process_creation
  product: windows
detection:
  selection_tasklist:
    Image|endswith: '\tasklist.exe'
  selection_targets:
    CommandLine|contains:
      - 'vboxservice.exe'
      - 'vmwaretray.exe'
      - 'vmtoolsd.exe'
      - 'qemu-ga.exe'
      - 'xenservice.exe'
  condition: selection_tasklist and selection_targets
falsepositives:
  - Legitimate system administration scripts checking for virtualization tools
  - IT asset inventory tools
level: medium
fields:
  - Image
  - CommandLine
  - ParentImage