title: Rundll32 Launched via start /min from AppData Script Loading Non-Standard DLL
status: stable 
id: 22952d0f-5012-4bec-b414-29e28b8ea5ed
description: |
  Detects rundll32.exe being launched via a start /min command from a script located in the AppData directory, which then loads a non-standard DLL. This behavior is often associated with malware that uses rundll32 to execute malicious code while attempting to minimize visibility by running the process in a minimized window.
author: Luís Marques, SIBS Cyberwatch @remotecodeexec
date: '2026-07-02'
modified: '2026-07-02'
tags:
  - attack.t1218.011
  - attack.t1574.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_rundll32:
    Image|endswith: '\rundll32.exe'
  selection_parent_start_min:
    ParentCommandLine|contains|all:
      - 'start /min'
      - '\AppData'
  selection_dll_userwritable:
    CommandLine|contains: '\AppData'
  filter_system32:
    CommandLine|contains: '\System32'
  condition: selection_rundll32 and selection_parent_start_min and selection_dll_userwritable and not filter_system32
falsepositives:
  - Legitimate software installers or update scripts that stage DLLs under AppData and invoke rundll32 via start /min
level: medium
