title: Bulk AD User Enumeration via Get-ADUser Wildcard Filter
status: stable
id: 123b72f2-649e-4ee7-a525-d8fb742bfb7e
description: |
    Detects attempts to enumerate Active Directory user objects using the Get-ADUser cmdlet with wildcard filters. This technique is often employed by attackers to gather information about user accounts and their attributes.
author: Luís Marques, SIBS Cyberwatch @remotecodeexec
references:
  - https://www.huntress.com/blog/ai-coded-malware-vibe-coding-active-directory
date: '2026-07-13'
modified: '2026-07-13'
tags:
  - attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmdlet:
    CommandLine|contains: 'Get-ADUser'
  selection_wildcard:
    CommandLine|contains|all:
      - '-Filter'
      - '-Properties'
  selection_output_files:
    CommandLine|contains:
      - 'AD_Users.csv'
      - 'AD_Simple_Users.csv'
      - 'AD_Users_With_Email.csv'
  condition: (selection_cmdlet and selection_wildcard) or selection_output_files
falsepositives:
  - Legitimate AD administration or auditing scripts run by IT staff
  - Scheduled inventory or compliance reporting tools
level: medium
fields:
  - CommandLine
  - Image
  - ParentImage
  - User
