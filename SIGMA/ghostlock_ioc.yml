title: GhostLock Tool Artifacts Detected
id: 19971a04-61d2-4481-8e77-34bc6fd654bb
description: Detects the creation or presence of specific artifact files (.ghostlock_authorized and ghostlock_cache.json) associated with the GhostLock proof-of-concept availability weapon. These files are used by the tool to manually authorize locking operations in specific directories and to cache discovered file lists for rapid session re-establishment.
references:
  - https://github.com/kimd155/ghostlock
  - https://ghostlock.io
  - https://www.bleepingcomputer.com/news/security/new-ghostlock-tool-abuses-windows-api-to-block-file-access/
author: Luís Marques, SIBS Cyberwatch @remotecodeexec
date: 2026-05-12
tags:
  - attack.ta0002
  - attack.t1059.006
logsource:
  product: windows
  category: file_event
detection:
  selection:
    # Detects the specific authorization marker and discovery cache files used by the GhostLock PoC
    TargetFilename|endswith:
      - '\.ghostlock_authorized'
      - '\ghostlock_cache.json'
  condition: selection
falsepositives:
  - 'Authorized red team engagements or penetration testing utilizing the GhostLock tool.'
  - 'Security researchers running the GhostLock PoC in isolated lab environments. Exclude specific test machine IPs or user accounts if necessary.'
level: high