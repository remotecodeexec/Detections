title: File Deletion Via Del
status: stable
id: 36792740-b1de-45ab-a754-5cbce6619620
description: "Detects execution of the builtin del/erase commands in order to delete files. Adversaries may delete files left behind by the actions of their intrusion activity. Malware, tools, or other non-native files dropped or created on a system by an adversary may leave traces to indicate to what was done within a network and how. Removal of these files can occur during an intrusion, or as part of a post-intrusion process to minimize the adversary's footprint."
references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.004/T1070.004.md
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/erase
author: Luís Marques, SIBS Cyberwatch @remotecodeexec
date: 2026-03-13
modified: 2026-07-14
tags:
  - attack.defense-evasion
  - attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\cmd.exe'
  selection_del:
    CommandLine|contains:
      - 'del '
      - 'erase '
  selection_flags:
    CommandLine|contains|windash:
      - ' -f'
      - ' -s'
      - ' -q'
      - ' -a'
      - ' -l'
      - ' -p'
      - ' -r'
      - ' /f'
      - ' /s'
      - ' /q'
      - ' /a'
      - ' /l'
      - ' /p'
      - ' /r'
  filter_normal:
    CommandLine|contains:
      - '\OneDriveSetup.exe'
      - 'AppData\Local\Temp\DockerDesktop'
      - 'ClickShareButtonApp'
      - 'C:\Windows\TEMP'
      - 'AppData\Local\Temp'
      - 'AppData\Local\UWST'
      - 'ProgramData\HP\HP PageWide Pro 477dw MFP'
  filter_legit_parents:
    ParentImage|contains:
      - '\lenovovantage-(lenovosystemupdateaddin).exe'
      - 'empower\instruments'
      - 'empower\bin'
  filter_System:
    User|contains:
      - 'system'
  filter_app:
    ParentImage|contains: 'infocert-sign-desktop\app-3.1.1\infocertsigndesktop.exe'
  condition: all of selection_* and not filter_normal and not filter_legit_parents and not filter_System and not filter_app
fields:
  - CommandLine
  - Image
  - ParentImage
falsepositives:
  - False positives levels will differ Depending on the environment. You can use
    a combination of ParentImage and other keywords from the CommandLine field
    to filter legitimate activity
level: low