title: Suspicious Shell Execution via Obsidian
id: aea52096-6d8c-4a9c-9057-5c42ec3f1548
status: stable
description: Detects the execution of shell interpreters (such as cmd, powershell, bash, osascript) as child processes of the Obsidian note-taking application. This behavior was observed in the REF6598 campaign where threat actors abused the "Shell Commands" community plugin to deliver the PHANTOMPULSE RAT. It also detects specific command-line indicators associated with the campaign.
author: Luis Marques, SIBS Cyberwatch @remotecodeexc
references:
  - https://www.elastic.co/security-labs/phantom-in-the-vault
date: 2026-04-14
tags:
  - attack.initial-access
  - attack.t1566.002
  - attack.execution
  - attack.t1059.001
  - attack.t1059.003
  - attack.t1059.004
logsource:
  category: process_creation
detection:
  selection_obsidian_parent:
    ParentImage|endswith:
      - '\Obsidian.exe'
      - '/Obsidian'
  selection_shell_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '/sh'
      - '/bash'
      - '/zsh'
      - '/osascript'
  selection_iocs:
    CommandLine|contains:
      - 'http://195.3.222.251'
      - 'syncobs.exe'
      - '0x666.info'
      - 't.me/ax03bot'
      - 'com.vfrfeufhtjpwgray.plist'
      - 'v1/updates/check?build=payloads'
  selection_macos_curl:
    CommandLine|contains|all:
      - 'txid='
      - '&bmodule'
  condition: (selection_obsidian_parent and selection_shell_child) or selection_iocs or selection_macos_curl
falsepositives:
  - Users who legitimately use the "Shell Commands" community plugin in Obsidian to execute expected shell scripts. If this occurs in your environment, tune the rule by excluding the specific expected commands or scripts.
level: high