title: Bulk AD Computer Enumeration via Get-ADComputer Wildcard Filter
status: stable
id: 5fc93936-fe45-4033-98e7-134274704e62
description: |
    Detects attempts to enumerate Active Directory computer objects using the Get-ADComputer cmdlet with wildcard filters. This technique is often employed by attackers to gather information about networked devices and their configurations.
author: Luís Marques, SIBS Cyberwatch @remotecodeexec
references:
  - https://www.huntress.com/blog/ai-coded-malware-vibe-coding-active-directory
date: '2026-07-14'
modified: '2026-07-14'
tags:
  - attack.t1018
  - attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd:
    - CommandLine|contains: 'Get-ADComputer'
  selection_filter:
    CommandLine|contains: '-Filter'
  selection_props:
    CommandLine|contains|all:
      - '-Server'
      - '-Properties'
  selection_export:
    CommandLine|contains: 'AD_Computers.csv'
  condition: selection_cmd and (selection_filter or selection_props or selection_export)
falsepositives:
  - Legitimate administrative AD inventory scripts
  - Scheduled asset management or compliance reporting jobs
fields:
  - CommandLine
  - Image
  - ParentImage
  - User
level: medium
