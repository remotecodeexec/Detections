title: Suspicious Curl Payload Download To ProgramData
id: a6952799-038b-4f4d-9199-ca3627c0a995
status: stable
description: |
  Detects the execution of curl.exe to download an executable payload directly into the C:\ProgramData\ directory. 
  This behavior was observed in MuddyWater campaigns utilizing the Chaos ransomware false flag to retrieve their initial dropper (ms_upd.exe).
author: Luís Marques, SIBS Cyberwatch @remotecodeexec
references:
  - https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
date: 2026-05-07
tags:
  - attack.execution
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\curl.exe'
    - OriginalFileName: 'curl.exe'
  selection_cmd:
    CommandLine|contains|all:
      - 'http'
      - '-o'
      - 'C:\ProgramData\'
      - '.exe'
  condition: selection_img and selection_cmd  
falsepositives:
  - Legitimate administrative scripts or third-party updaters using curl to fetch executable updates.
level: medium
