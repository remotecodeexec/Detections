title: CryptoBandits Local Tor Proxy via Curl
id: c9a1a434-999e-4b94-8062-b3f89e28cde8 
status: stable 
description: Detects the usage of curl.exe routing traffic through a local SOCKS5 proxy on port 9050, a behavior observed in CryptoBandits malware communicating with a bundled Tor client to hide its Command and Control (C2) destination.
author: Luís Marques, SIBS Cyberwatch @remotecodeexec
references:
  - https://www.microsoft.com/en-us/security/blog/2026/06/17/crypto-clipper-uses-tor-worm-like-propagation-for-persistence-control/
date: 2026-06-22
tags:
  - attack.t1090.003
  - attack.t1071.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\curl.exe'
    - OriginalFileName: 'curl.exe'
  selection_cli:
    CommandLine|contains|all:
      - '--socks5-hostname'
      - 'localhost:9050'
  condition: selection_img and selection_cli
falsepositives:
  - Legitimate developer or administrative use of curl with a local proxy. If false positives are observed, consider filtering by specific parent processes (e.g., known IDEs, legitimate deployment scripts) or specific user groups.
level: high